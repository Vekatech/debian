{{- $stage    := or .stage    "full" -}}
{{- $arch     := or .arch     "arm64" -}}
{{- $suite    := or .suite    "trixie" -}}
{{- $board    := or .board    "vk-d184280e" -}}
{{- $locale   := or .locale   "en_US" -}}
{{- $user     := or .user     "vkrz" -}}
{{- $pass     := or .pass     "vkrzg2lc" -}}
{{- $hostname := or .hostname (printf "%s" $board) -}}
{{- $outdir   := or .outdir   (printf "images/%s" $board) -}}
{{- $pack     := or .pack     (printf "debian-%s-%s.tgz" $suite $arch) -}}
{{- $image    := or .image    (printf "%s/debian-%s-%s.img" $outdir $suite $board) -}}
{{- $sparse_image :=          (printf "debian-%s-%s.simg" $suite $board) -}}

architecture: {{ $arch }}

actions:
{{if or (eq $stage "common") (eq $stage "full")}}
  - action: debootstrap
    description: create basic Debian filesystem
    suite: {{ $suite }}
    components:
      - main
    mirror: http://cdn.debian.net/debian/
    variant: minbase

  - action: apt
    description: add extra packages
    packages: [
        kmod, systemd-sysv, netbase, ca-certificates, locales,
        iproute2, iw, wpasupplicant, connman,
        fdisk, dosfstools,
        fbi, polkitd, udisks2, gvfs,
        python3-aiohttp, python3-passlib, python3-pyudev, python3-pydbus,
        weston, chromium,
        adduser, systemd-timesyncd
    ]

  - action: run
    description: cleanup packages after install
    chroot: true
    command: apt clean

  - action: run
    description: set default locale
    chroot: true
    script: scripts/setup-locale.sh {{ $locale }}

  - action: run
    description: add a new user (will be in sudoers)
    chroot: true
    script: scripts/setup-user.sh {{ $user }} "{{ $pass }}" -n

  - action: run
    description: add a user to group video, audio, dialout, tty, disk, kmem, kvm
    chroot: true
    command: usermod -aG video,audio,dialout,tty,disk,kmem,kvm {{ $user }}

  - action: run
    description: Add reboot and poweroff aliases to {{ $user }}
    chroot: true
    command: |
      echo "alias reboot='systemctl reboot'\nalias poweroff='systemctl poweroff'" >> /home/{{ $user }}/.bashrc

  - action: overlay
    description: command for fixing serial console terminal size
    source: overlays/fixterm

{{if eq $stage "common"}}
  - action: pack
    file: {{ $pack }}
    compression: gz
{{end}}
{{end}}

{{if or (eq $stage "board") (eq $stage "full")}}
{{if eq $stage "board"}}
  - action: unpack
    file: {{ $pack }}
    compression: gz
{{end}}

  - action: run
    description: set hostname
    chroot: true
    command: echo {{ $hostname }} > /etc/hostname

  - action: run
    description: set hosts file
    chroot: true
    script: scripts/setup-hosts.sh {{ $hostname }}

  - action: overlay
    description: add board specific files
    source: overlays/boards/{{ $board }}

  - action: run
    description: set ownership of the WEBPANEL APP files
    chroot: true
    command: chown -R {{ $user }}:{{ $user }} /home/{{ $user }}

  - action: run
    description: set weston to autostart on boot
    chroot: true
    script: scripts/setup-weston.sh {{ $user }}
    
  - action: run
    description: set WEBPANEL app to autostart on boot
    chroot: true
    script: scripts/setup-webpanel.sh CH

  - action: run
    description: set WiFi regulatory DB
    chroot: true
    script: scripts/setup-wifi.sh yocto

  - action: image-partition
    description: create a partitioned image
    imagename: {{ $image }}
    imagesize: 2GB
    partitiontype: msdos
    mountpoints:
      - mountpoint: /
        partition: rootfs
        options: [ noatime ]
      - mountpoint: /boot
        partition: boot
    partitions:
      - name: boot
        fs: fat32
        start: 0%
        end: 100MB
        flags: [ boot ]
      - name: rootfs
        fs: ext4
        start: 100MB
        end: 100%

  - action: filesystem-deploy
    description: deploying filesystem onto image

#  - action: run
#    description: create sparse image
#    postprocess: true
#    command: img2simg {{ $image }} {{ $sparse_image }}

  - action: run
    description: obtain a bitmap file for faster flashing
    postprocess: true
    command: bmaptool create {{ $image }} -o {{ $image }}.bmap

  - action: run
    description: compress the image
    postprocess: true
    command: xz -T0 -f -k {{ $image }}
    
  - action: run
    description: compress image as gz
    postprocess: true
    command: pigz -f -k {{ $image }}
{{end}}
